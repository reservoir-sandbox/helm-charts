replicaCount: 1

image:
  repository: ghcr.io/reservoir-sandbox/frontend
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

serviceAccount:
  create: false
  name: ""

config:
  backendUrl: "http://backend-backend:8000"
  API_URL: "http://backend-backend:8000"
  nodeEnv: "production"

  VITE_API_URL: "http://api.sandbox.reservoir"
  API_BASE_URL: "http://api.sandbox.reservoir"



ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: "frontend.sandbox.reservoir"
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend-frontend
              port:
                number: 3000
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: backend-backend
              port:
                number: 8000
    - host: "api.sandbox.reservoir"
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: backend-backend
              port:
                number: 8000
  tls:
    - secretName: frontend-tls
      hosts:
        - "frontend.sandbox.reservoir"
        - "api.sandbox.reservoir"

networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infrastructure
          podLabels:
            app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podLabels:
            app.kubernetes.io/name: backend
      ports:
        - protocol: TCP
          port: 8000

replicaCount: 1

image:
  repository: ghcr.io/your-org/frontend # Replace with your actual image repository
  pullPolicy: IfNotPresent
  # tag: "latest" # Uncomment and set a specific tag, or use image.fluxPolicy for CI integration
  # For Flux Image Automation:
  # fluxPolicy: "frontend-image-policy"


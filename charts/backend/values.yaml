# Default values for backend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/your-org/backend # Replace with your actual image repository
  pullPolicy: IfNotPresent
  # tag: "latest" # Uncomment and set a specific tag, or use image.fluxPolicy for CI integration
  # For Flux Image Automation:
  # fluxPolicy: "backend-image-policy" 

service:
  type: ClusterIP
  port: 80

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true


name: Publish Helm Charts

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  publish-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          charts_dir: charts

      - name: Update chart version in gitops-deployment
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gitops-deployment
          token: ${{ secrets.PAT_TOKEN }}
          path: gitops-deployment

      - name: Install yq
        run: |
          wget https://github.com/mikefarah/yq/releases/download/v4.25.1/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Bump Chart version and update HelmRelease
        run: |
          CURRENT_VERSION=$(yq eval '.version' charts/frontend/Chart.yaml)

          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"

          NEW_PATCH=$((patch + 1))
          NEW_VERSION="$major.$minor.$NEW_PATCH"

          export NEW_VERSION
          yq eval -i '.version = strenv(NEW_VERSION)' charts/frontend/Chart.yaml

          yq eval -i '.spec.chart.spec.version = strenv(NEW_VERSION)' gitops-deployment/apps/frontend/frontend-release.yaml

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add charts/frontend/Chart.yaml
          if [ -n "$(git status --porcelain charts/frontend/Chart.yaml)" ]; then
            git commit -m "chore: bump frontend chart version to ${NEW_VERSION} [skip ci]"
            git push
          fi

          git -C gitops-deployment add apps/frontend/frontend-release.yaml
          if [ -n "$(git -C gitops-deployment status --porcelain apps/frontend/frontend-release.yaml)" ]; then
            git -C gitops-deployment commit -m "Update frontend chart to version ${NEW_VERSION}"
            git -C gitops-deployment push
          fi

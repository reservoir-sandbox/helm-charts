name: Publish Helm Charts

on:
  push:
    branches:
      - main
    # CRITICAL FIX: Prevent infinite loop by ignoring commits made by the actions bot itself
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  publish-charts:
    # CRITICAL FIX: Double check at job level that we do not trigger on bot's own commits
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # Step 1: Checkout the charts repository (fetch-depth: 0 is mandatory for chart-releaser)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Install Helm binary
      - name: Install Helm
        uses: azure/setup-helm@v4

      # Step 3: Configure global Git credentials for automated commits
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"

      # Step 4: Checkout the infrastructure GitOps repository into a subfolder
      - name: Checkout gitops-deployment repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gitops-deployment
          token: ${{ secrets.PAT_TOKEN }}
          path: gitops-deployment

      # Step 5: Automatically calculate the next version and update BOTH repositories
      - name: Bump Chart version and update HelmRelease manifests
        run: |
          # Read the current version from Chart.yaml
          CURRENT_VERSION=$(yq eval '.version' charts/frontend/Chart.yaml)

          # Parse semantic versioning components (Major.Minor.Patch)
          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"

          # Increment the patch version by 1 automatically
          NEW_PATCH=$((patch + 1))
          NEW_VERSION="$major.$minor.$NEW_PATCH"

          # Export to both environment and next steps
          export NEW_VERSION
          echo "CHART_VERSION=${NEW_VERSION}" >> $GITHUB_ENV

          # Apply the identical new version string to both files immediately
          yq eval -i '.version = strenv(NEW_VERSION)' charts/frontend/Chart.yaml
          yq eval -i '.spec.chart.spec.version = strenv(NEW_VERSION)' gitops-deployment/apps/frontend/frontend-release.yaml

          # Commit and push the new version back to the charts repository BEFORE chart-releaser runs
          git add charts/frontend/Chart.yaml
          if [ -n "$(git status --porcelain charts/frontend/Chart.yaml)" ]; then
            git commit -m "chore: bump frontend chart version to ${NEW_VERSION}"
            git push
          else
            echo "Chart version has not changed."
          fi

      # Step 6: Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 7: Build local chart dependencies (embeds 'common' chart)
      - name: Build chart dependencies
        run: |
          helm dependency build charts/frontend/

      # Step 8: Run chart-releaser to publish the newly generated version to GitHub Pages
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_SKIP_EXISTING: "true"
        with:
          charts_dir: charts

      # Step 9: Push the already modified HelmRelease manifest to the GitOps repo
      - name: Push updated HelmRelease to GitOps repo
        run: |
          git -C gitops-deployment add apps/frontend/frontend-release.yaml
          if [ -n "$(git -C gitops-deployment status --porcelain apps/frontend/frontend-release.yaml)" ]; then
            git -C gitops-deployment commit -m "Update frontend chart deployment to version ${CHART_VERSION}"
            git -C gitops-deployment push
          else
            echo "HelmRelease manifest is already synchronized."
          fi

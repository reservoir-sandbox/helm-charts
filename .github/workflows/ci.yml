name: Publish Helm Charts to OCI GHCR

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

env:
  # Изменено для OCI: Базовый реестр без имени владельца
  REGISTRY: ghcr.io

jobs:
  publish-charts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # Step 1: Checkout the charts repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Install Helm binary
      - name: Install Helm
        uses: azure/setup-helm@v4

      # Step 3: Configure global Git credentials
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Step 4: Checkout the infrastructure GitOps repository into a subfolder
      - name: Checkout gitops-deployment repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gitops-deployment
          token: ${{ secrets.PAT_TOKEN }}
          path: gitops-deployment

      # Step 5: Log in to GitHub Container Registry BEFORE the loop (Mandatory for OCI helm push)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 6: Process, bump, package, and PUSH changed charts to OCI Registry
      - name: Process, bump and prepare ONLY changed charts
        run: |
          # Get a list of directories that actually have changes in the current commit
          CHANGED_FOLDERS=$(git diff --name-only HEAD~1 HEAD | awk -F/ '{print $1"/"$2}' | sort -u)

          # Prepare temporary directory for packaged .tgz files
          PACKAGED_DIR="/tmp/packaged-charts"
          mkdir -p "$PACKAGED_DIR"

          # Secure lowercase OCI registry path format (standard for docker artifacts)
          LOWER_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          OCI_TARGET_URL="oci://ghcr.io/${LOWER_OWNER}/helm-charts"

          for chart_dir in charts/frontend charts/backend charts/jobs; do
            if [ -d "$chart_dir" ]; then
              chart_name=$(basename "$chart_dir")

              if echo "$CHANGED_FOLDERS" | grep -q "$chart_dir"; then
                echo "🚀 Changes detected in chart: $chart_name. Starting OCI registry push..."

                # 1. Read and calculate the next version
                CURRENT_VERSION=$(yq eval '.version' ${chart_dir}/Chart.yaml)
                IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
                NEW_PATCH=$((patch + 1))
                NEW_VERSION="$major.$minor.$NEW_PATCH"

                # 2. Update version inside Chart.yaml
                export NEW_VERSION
                yq eval -i '.version = strenv(NEW_VERSION)' ${chart_dir}/Chart.yaml

                # 3. Build Helm dependencies
                helm dependency build $chart_dir/

                # 4. FIXED: Native Helm OCI Packaging and Direct Push
                helm package $chart_dir/ -d "$PACKAGED_DIR"
                helm push "${PACKAGED_DIR}/${chart_name}-${NEW_VERSION}.tgz" "$OCI_TARGET_URL"
                echo "✅ Successfully pushed $chart_name version $NEW_VERSION to $OCI_TARGET_URL"

                # 5. Map directory to its correct Flux folder inside gitops repo
                flux_dir="apps"
                if [ "$chart_name" = "jobs" ]; then
                  flux_dir="jobs"
                fi

                # 6. Update HelmRelease version in GitOps repository if the file exists
                flux_manifest="gitops-deployment/${flux_dir}/${chart_name}/${chart_name}-release.yaml"
                if [ -f "$flux_manifest" ]; then
                  yq eval -i '.spec.chart.spec.version = strenv(NEW_VERSION)' "$flux_manifest"
                  echo "✅ Updated $chart_name manifest in GitOps to version $NEW_VERSION"
                fi
              else
                echo "💤 No changes detected in $chart_dir. Skipping bump."
                helm dependency build $chart_dir/
              fi
            fi
          done

          # Commit and push all updated Chart.yaml files back to the charts repository
          git add charts/*/Chart.yaml
          if [ -n "$(git status --porcelain charts/*/Chart.yaml)" ]; then
            git commit -m "chore: automated charts version bump for changed services [oci setup]"
            git push
          else
            echo "No chart versions were changed in this run."
          fi

      # Step 7: Push all modified HelmRelease manifests to the GitOps repo in one single commit
      - name: Push updated HelmRelease manifests to GitOps repo
        run: |
          git -C gitops-deployment add .
          if [ -n "$(git -C gitops-deployment status --porcelain)" ]; then
            git -C gitops-deployment commit -m "Update applications deployment manifests to the latest OCI chart versions"
            git -C gitops-deployment push
          else
            echo "All GitOps manifests are already up to date."
          fi
